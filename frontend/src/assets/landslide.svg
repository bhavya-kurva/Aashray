<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="landslide-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#19110b" />
      <stop offset="50%" stop-color="#2d1b0d" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    <linearGradient id="mountain-back" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3e200c" />
      <stop offset="100%" stop-color="#1e1006" />
    </linearGradient>
    <linearGradient id="mountain-mid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#2c1404" />
    </linearGradient>
    <linearGradient id="shear-zone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#b45309" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="debris-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.4" />
    </linearGradient>
  </defs>

  <!-- Background Sky -->
  <rect width="1200" height="800" fill="url(#landslide-sky)" />

  <!-- Topographic Elevation Contours -->
  <g fill="none" stroke="#f59e0b" stroke-opacity="0.12" stroke-width="1.5">
    <path d="M 0 160 C 250 140 450 200 680 170 C 900 140 1080 180 1200 160" />
    <path d="M 0 240 C 220 210 480 280 720 230 C 940 190 1060 250 1200 220" stroke-dasharray="8 6" />
    <path d="M 0 320 C 300 290 520 370 780 310 C 980 260 1100 330 1200 300" />
    <path d="M 0 400 C 260 360 480 440 820 370 C 1020 330 1120 410 1200 380" stroke-dasharray="6 4" />
  </g>

  <!-- Distant Mountain Peaks -->
  <polygon points="120,450 320,180 480,380 620,200 840,460" fill="url(#mountain-back)" />
  <polygon points="560,460 760,160 920,340 1060,210 1200,420" fill="url(#mountain-back)" opacity="0.85" />

  <!-- Midground Steep Slope Face (Intact Side) -->
  <path d="M 0 520 L 0 340 L 260 220 L 480 340 L 520 480 L 380 580 Z" fill="url(#mountain-mid)" />

  <!-- Mountain Cliff Ridge & Fault Line (Failure Plane) -->
  <path d="M 380 200 L 540 320 L 620 430 L 740 560 L 820 680" fill="none" stroke="#f59e0b" stroke-width="5" stroke-dasharray="14 6" stroke-linecap="round" />
  
  <!-- Collapsing Unstable Slope Mass / Shear Zone -->
  <path d="M 540 320 L 860 390 L 1020 540 L 880 740 L 620 760 L 580 620 L 620 430 Z" fill="url(#shear-zone)" />

  <!-- Active Rockfall Debris and Boulders (Cascading Flow) -->
  <!-- Large Fractured Rock 1 -->
  <polygon points="680,480 730,460 760,510 720,540 670,520" fill="#92400e" stroke="#fbbf24" stroke-width="2" />
  <!-- Large Fractured Rock 2 -->
  <polygon points="780,550 840,530 870,590 820,620 770,590" fill="#78350f" stroke="#f59e0b" stroke-width="2.5" />
  <!-- Fractured Rock 3 -->
  <polygon points="630,580 670,560 690,600 650,620" fill="#b45309" stroke="#fde68a" stroke-width="1.5" />
  <!-- Fractured Rock 4 -->
  <polygon points="720,650 780,630 800,680 750,710 700,680" fill="#92400e" stroke="#fbbf24" stroke-width="2" />

  <!-- Small cascading debris stones -->
  <circle cx="610" cy="490" r="10" fill="#d97706" />
  <circle cx="650" cy="520" r="14" fill="#b45309" stroke="#f59e0b" stroke-width="1.5" />
  <circle cx="750" cy="490" r="8" fill="#f59e0b" />
  <circle cx="710" cy="580" r="12" fill="#d97706" />
  <circle cx="860" cy="650" r="16" fill="#92400e" stroke="#fbbf24" stroke-width="2" />
  <circle cx="810" cy="700" r="11" fill="#b45309" />
  <circle cx="670" cy="670" r="9" fill="#f59e0b" />
  <circle cx="920" cy="690" r="14" fill="#78350f" />
  <circle cx="890" cy="600" r="7" fill="#fbbf24" />

  <!-- Dust Cloud / Silt Plume around Collapse Zone -->
  <path d="M 580 660 Q 640 560 740 600 Q 840 570 920 640 Q 980 700 900 760 Q 760 790 640 760 Z" fill="#d97706" fill-opacity="0.25" filter="blur(8px)" />

  <!-- Slope Collapse Vector Warning Arrows -->
  <g fill="none" stroke="#fde047" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 520 280 L 640 380" />
    <polygon points="640,380 625,372 633,387" fill="#fde047" />

    <path d="M 680 400 L 800 500" />
    <polygon points="800,500 785,492 793,507" fill="#fde047" />

    <path d="M 760 540 L 860 630" />
    <polygon points="860,630 845,622 853,637" fill="#fde047" />
  </g>

  <!-- Foreground Ground Base -->
  <path d="M 0 680 L 320 640 L 580 700 L 1200 660 L 1200 800 L 0 800 Z" fill="#231206" />
</svg>
