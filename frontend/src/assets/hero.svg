<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="hero-sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="80%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0c2340" />
    </linearGradient>
    <radialGradient id="radar-glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3" />
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="80%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="grid-pulse" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.02" />
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#hero-sky)" />
  <rect width="1600" height="900" fill="url(#radar-glow)" />

  <!-- Global Telemetry Grid & Hexagonal Sensors -->
  <g stroke="#38bdf8" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="150" x2="1600" y2="150" />
    <line x1="0" y1="300" x2="1600" y2="300" />
    <line x1="0" y1="450" x2="1600" y2="450" />
    <line x1="0" y1="600" x2="1600" y2="600" />
    <line x1="0" y1="750" x2="1600" y2="750" />
    
    <line x1="200" y1="0" x2="200" y2="900" />
    <line x1="400" y1="0" x2="400" y2="900" />
    <line x1="600" y1="0" x2="600" y2="900" />
    <line x1="800" y1="0" x2="800" y2="900" />
    <line x1="1000" y1="0" x2="1000" y2="900" />
    <line x1="1200" y1="0" x2="1200" y2="900" />
    <line x1="1400" y1="0" x2="1400" y2="900" />
  </g>

  <!-- Central Strategic Mission Radar Rings -->
  <g transform="translate(800, 420)">
    <circle cx="0" cy="0" r="380" fill="none" stroke="#38bdf8" stroke-opacity="0.06" stroke-width="2" />
    <circle cx="0" cy="0" r="280" fill="none" stroke="#38bdf8" stroke-opacity="0.12" stroke-width="2" stroke-dasharray="12 8" />
    <circle cx="0" cy="0" r="180" fill="none" stroke="#818cf8" stroke-opacity="0.18" stroke-width="2" />
    <circle cx="0" cy="0" r="80" fill="none" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="6 4" />
    
    <!-- Sweep Angle Radar Line -->
    <line x1="0" y1="0" x2="240" y2="-140" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="2" stroke-linecap="round" />
    <polygon points="0,0 240,-140 280,-100" fill="#38bdf8" fill-opacity="0.05" />
  </g>

  <!-- Coastal Ocean Surge Waveform Silhouette at Base -->
  <path d="M 0 720 Q 300 660 600 700 T 1200 680 T 1600 710 L 1600 900 L 0 900 Z" fill="#031528" opacity="0.9" />
  <path d="M 0 780 C 400 720 800 820 1200 750 Q 1400 710 1600 760 L 1600 900 L 0 900 Z" fill="#020d1a" />
</svg>
