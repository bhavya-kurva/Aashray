    <polygon points="0,-90 -35,60 35,60" fill="#052e16" />
    <rect x="-8" y="-30" width="16" height="40" fill="#ffffff" rx="2" />
    <rect x="-20" y="-18" width="40" height="16" fill="#ffffff" rx="2" />
